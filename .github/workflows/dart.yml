name: Publish to pub.dev

# Flutter package (webview_flutter / WebGL).
# Pub.dev → package → Admin → "Automated publishing" must be enabled with:
#   repository:  Nebulino/live2d.dart
#   tag pattern: v{{version}}
# Then publish with:
#   git tag v1.0.0 && git push origin v1.0.0
# (`version:` in pubspec.yaml must match the tag, minus the leading "v")
#
# NOTE: `live2d` is not on pub.dev yet — the first publication must be done once
# by hand (`flutter pub publish`) so the package exists and can be claimed by
# the nebulino.cloud verified publisher. Only then configure automated publishing.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      id-token: write   # required for OIDC authentication to pub.dev
      contents: read
    # Official Dart Team reusable workflow: sets up Dart *and* Flutter, provides
    # the OIDC token, runs `dart pub publish --dry-run` then `dart pub publish -f`.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

